# Fly.io deployment. See docs/DEPLOY.md for why this host and not a free one.
app = "saafsaans"

# Singapore, because Fly no longer has an India region. This said "bom" until
# 2026-08-31, by which time Fly had deprecated Mumbai and delisted it: cloning a
# machine into it returns "Region bom is deprecated and cannot have new
# resources provisioned." Fly moved the running machine to sin on 2026-08-20.
#
# Leaving "bom" here was not cosmetic. primary_region is what a new machine is
# created in, so the next deploy after the current machine was destroyed would
# have failed outright.
#
# The audience is in Delhi and sin is the nearest region Fly still offers -- it
# costs a Delhi reader roughly 40-60ms of round trip against Mumbai, which is
# noise next to the seconds this app spends resuming from suspend.
primary_region = "sin"

[build]

[env]
  # Matches internal_port below and the Dockerfile's default. Set explicitly so
  # the two cannot drift apart silently.
  PORT = "7860"

  # On the volume, not the container filesystem, which is replaced on every
  # deploy. A counter that resets on deploy measures deploys, not readers.
  SAAFSAANS_VIEWPORT_DB = "/data/viewport-counts.sqlite3"

[http_service]
  internal_port = 7860
  force_https = true

  # Scale to zero. A portfolio demo is idle almost always, and a stopped
  # machine bills only its rootfs rather than its CPU and memory. The cost of
  # this choice is a cold start for the first visitor after a quiet spell;
  # suspend resumes faster than a full stop, which is why it is preferred here.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # The app is healthy when it can answer for itself. /health reports which
  # back ends are actually wired up, so a pass means "serving", not merely
  # "the process started".
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

# The viewport probe's page-load counts: four rows, a few kilobytes, and the
# only state this app keeps between deploys. 1 GB is Fly's minimum, not a size
# estimate -- measured growth is nil, because the table can never exceed three
# counter rows and one date.
#
# The volume must EXIST before the first deploy that carries this block, or the
# deploy fails outright:
#   flyctl volumes create saafsaans_data --app saafsaans --region sin --size 1
#
# A fresh Fly volume mounts owned by root, and the Dockerfile runs as uid 1000
# (Hugging Face Spaces requires it and the image never returns to root), so
# check `ls -ldn /data` after the first deploy. If it is root-owned the counter
# is silently dead while pages serve normally, and the System view says so.
[[mounts]]
  source = "saafsaans_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
